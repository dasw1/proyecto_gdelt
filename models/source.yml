sources:
  - name: bronze
    database: "{{ env_var('DBT_BRONZE_DB', 'GDELT_BRONZE_DEV') }}"
    schema: STAGING
    tables:
      - name: gdelt_export
        description: "Tabla bronze con los datos crudos de GDELT export"
        config:
          loaded_at_field: _LOADED_AT
          freshness:
            warn_after: {count: 25, period: hour}
            error_after: {count: 48, period: hour}
      - name: CAMEO_CODE_LIST
        description: "Lista de códigos CAMEO con sus descripciones"
  - name: seeds
    database: "{{ env_var('DBT_BRONZE_DB', 'GDELT_BRONZE_DEV') }}"
    schema: DBT_GDELT_SEEDS
    tables:
      - name: country_list
      - name: actor_types_list
      - name: ethnic_list
      - name: known_groups_list
      - name: religion_list