version: 2

models:

  - name: int_actor_actor_type
    description: "Tabla puente entre actores y sus tipos de actor (relación N:M)"
    columns:
      - name: actor_id
        description: "FK hacia int_gdelt_actor"
        tests:
          - not_null
      - name: actor_type_id
        description: "FK hacia int_gdelt_type_actor"
        tests:
          - not_null
      - name: type_order
        description: "Orden del tipo de actor (1=principal, 2=secundario, 3=terciario)"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3]

  - name: int_gdelt_actor
    description: "Actores únicos identificados en los eventos GDELT con sus atributos normalizados. Tabla incremental."
    columns:
      - name: actor_id
        description: "Hash MD5 de actor_code + actor_name — clave única del actor"
        tests:
          - unique
          - not_null
      - name: actor_name
        description: "Nombre del actor en mayúsculas"
      - name: actor_code
        description: "Código completo del actor en GDELT"
      - name: country_id
        description: "Código ISO3 del país del actor"
      - name: ethnic_id
        description: "Código étnico del actor"
      - name: known_group_id
        description: "Código del grupo conocido del actor"
      - name: religion1_id
        description: "Religión principal del actor"
      - name: religion2_id
        description: "Religión secundaria del actor"

  - name: int_gdelt_cameo_full
    description: "Códigos CAMEO completos de 3 y 4 dígitos con descripción y jerarquía"
    columns:
      - name: cameo_full_id
        description: "Código CAMEO completo de 3 o 4 dígitos"
        tests:
          - unique
          - not_null
      - name: cameo_code_desc
        description: "Descripción del código CAMEO"
      - name: cameo_root_id
        description: "Código raíz CAMEO de 2 dígitos"
        tests:
          - not_null
      - name: cameo_subcode
        description: "Subcódigo del evento"

  - name: int_gdelt_cameo_root
    description: "20 categorías raíz del sistema CAMEO"
    columns:
      - name: cameo_root_id
        description: "Código raíz CAMEO de 2 dígitos"
        tests:
          - unique
          - not_null
      - name: cameo_code_desc
        description: "Descripción de la categoría raíz en formato título"
        tests:
          - not_null

  - name: int_gdelt_country_type
    description: "Tipos de país: país soberano, territorio dependiente o región geográfica"
    columns:
      - name: country_type_id
        description: "Identificador del tipo (1=región, 2=territorio, 3=país)"
        tests:
          - unique
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3]
      - name: country_type_name
        description: "Nombre del tipo de país"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Region', 'Territory', 'Country']
      - name: country_type_desc
        description: "Descripción detallada del tipo de país"

  - name: int_gdelt_country
    description: "Países, territorios y regiones geográficas normalizados a ISO3"
    columns:
      - name: country_id
        description: "Código ISO3 del país"
        tests:
          - unique
          - not_null
      - name: country_name
        description: "Nombre completo del país"
        tests:
          - not_null
      - name: country_type_id
        description: "FK hacia int_gdelt_country_type"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('int_gdelt_country_type')
                field: country_type_id

  - name: int_gdelt_date
    description: "Dimensión de fechas basada en las fechas reales de los eventos GDELT"
    columns:
      - name: date_id
        description: "Identificador de fecha en formato YYYYMMDD"
        tests:
          - unique
          - not_null
      - name: full_date
        description: "Fecha completa"
        tests:
          - unique
          - not_null
      - name: year
        description: "Año"
        tests:
          - not_null
      - name: month
        description: "Mes numérico"
        tests:
          - not_null
      - name: month_name
        description: "Nombre del mes"
        tests:
          - not_null
      - name: quarter
        description: "Trimestre"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4]
      - name: week_of_year
        description: "Semana del año"
        tests:
          - not_null
      - name: day_of_week
        description: "Día de la semana numérico"
        tests:
          - not_null
      - name: day_name
        description: "Nombre del día de la semana"
        tests:
          - not_null
      - name: is_weekend
        description: "TRUE si es fin de semana"
        tests:
          - not_null

  - name: int_gdelt_ethnic
    description: "Grupos étnicos presentes en los eventos GDELT"
    columns:
      - name: ethnic_id
        description: "Código del grupo étnico"
        tests:
          - unique
          - not_null
      - name: ethnic_name
        description: "Nombre del grupo étnico"
        tests:
          - not_null

  - name: int_gdelt_known_group
    description: "Grupos y organizaciones internacionales conocidos presentes en los eventos"
    columns:
      - name: known_group_id
        description: "Código del grupo conocido"
        tests:
          - unique
          - not_null
      - name: known_group_name
        description: "Nombre del grupo conocido"
        tests:
          - not_null

  - name: int_gdelt_quad_class
    description: "Clasificación de eventos en 4 categorías de cooperación y conflicto"
    columns:
      - name: quad_class_id
        description: "Identificador de la clase (1-4)"
        tests:
          - unique
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4]
      - name: quad_class_name
        description: "Nombre de la clase"
        tests:
          - not_null
      - name: quad_class_desc
        description: "Descripción detallada de la clase"
        tests:
          - not_null

  - name: int_gdelt_religion
    description: "Religiones con jerarquía padre-hijo y nombre del grupo religioso"
    columns:
      - name: religion_id
        description: "Código de religión CAMEO"
        tests:
          - unique
          - not_null
      - name: religion_name
        description: "Nombre de la religión"
        tests:
          - not_null
      - name: parent_id
        description: "Código de la religión padre"
        tests:
          - not_null
      - name: parent_name
        description: "Nombre de la religión padre"
        tests:
          - not_null

  - name: int_gdelt_type_actor
    description: "Tipos de actor según clasificación CAMEO"
    columns:
      - name: actor_type_id
        description: "Código del tipo de actor"
        tests:
          - unique
          - not_null
      - name: actor_type_name
        description: "Nombre del tipo de actor"
        tests:
          - not_null
      - name: actor_type_desc
        description: "Descripción del tipo de actor"
        tests:
          - not_null

  - name: int_gdelt_events
    description: "Tabla de hechos principal con todos los eventos GDELT. Tabla incremental — solo procesa eventos nuevos basándose en loaded_at."
    columns:
      - name: event_id
        description: "ID único del evento GDELT"
        tests:
          - unique
          - not_null
      - name: date_id
        description: "FK hacia int_gdelt_date en formato YYYYMMDD"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('int_gdelt_date')
                field: date_id
      - name: date_added
        description: "Timestamp exacto en que GDELT procesó el evento — usado para deduplicar versiones"
      - name: source_url
        description: "URL del artículo fuente"
      - name: is_root_event
        description: "TRUE si es el evento principal del artículo"
        tests:
          - not_null
      - name: goldstein_scale
        description: "Puntuación de impacto geopolítico (-10 a +10)"
      - name: num_mentions
        description: "Número de menciones del evento"
      - name: num_sources
        description: "Número de fuentes que cubren el evento"
      - name: num_articles
        description: "Número de artículos que cubren el evento"
      - name: avg_tone
        description: "Tono promedio de la cobertura mediática (-100 a +100)"
      - name: actor1_id
        description: "FK hacia int_gdelt_actor (actor iniciador)"
        tests:
          - relationships:
              arguments:
                to: ref('int_gdelt_actor')
                field: actor_id
      - name: actor2_id
        description: "FK hacia int_gdelt_actor (actor receptor)"
        tests:
          - relationships:
              arguments:
                to: ref('int_gdelt_actor')
                field: actor_id
      - name: cameo_code_id
        description: "FK hacia int_gdelt_cameo_full"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('int_gdelt_cameo_full')
                field: cameo_full_id
      - name: quad_class_id
        description: "FK hacia int_gdelt_quad_class"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('int_gdelt_quad_class')
                field: quad_class_id
      - name: loaded_at
        description: "Timestamp de carga en bronze — usado para el filtro incremental"
        tests:
          - not_null
      - name: source_file
        description: "Nombre del fichero fuente en S3"