version: 2

models:

  - name: __stg_actor_type_list
    description: "Staging de tipos de actor CAMEO"
    columns:
      - name: actor_type_id
        description: "Código del tipo de actor"
        tests:
          - unique
          - not_null
      - name: actor_type_name
        description: "Nombre del tipo de actor"
        tests:
          - not_null
      - name: actor_type_desc
        description: "Descripción del tipo de actor"

  - name: __stg_country_list
    description: "Staging de países con conversión FIPS a ISO3 y clasificación por tipo"
    columns:
      - name: country_code
        description: "Código original tal como viene en GDELT — puede ser FIPS o ISO3"
        tests:
          - not_null
      - name: fips_code
        description: "Código FIPS de 2 letras"
      - name: iso3_code
        description: "Código ISO3 de 3 letras estándar internacional"
        tests:
          - not_null
      - name: country_name
        description: "Nombre completo del país"
        tests:
          - not_null
      - name: country_type_id
        description: "Tipo de país: 1=región, 2=territorio, 3=país"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3]

  - name: __stg_ethnic_list
    description: "Staging de grupos étnicos CAMEO"
    columns:
      - name: ethnic_id
        description: "Código del grupo étnico"
        tests:
          - unique
          - not_null
      - name: ethnic_name
        description: "Nombre del grupo étnico"
        tests:
          - not_null

  - name: __stg_gdelt_cameo_code_list
    description: "Staging de códigos CAMEO completos con descripción"
    columns:
      - name: cameo_code_full_id
        description: "Código CAMEO completo de 3 o 4 dígitos"
        tests:
          - unique
          - not_null
      - name: cameo_code_desc
        description: "Descripción del código CAMEO"
        tests:
          - not_null

  - name: __stg_known_group_list
    description: "Staging de grupos y organizaciones internacionales conocidos"
    columns:
      - name: known_group_id
        description: "Código del grupo conocido"
      - name: known_group_name
        description: "Nombre del grupo conocido"

  - name: __stg_religion_list
    description: "Staging de religiones CAMEO con jerarquía padre-hijo"
    columns:
      - name: religion_id
        description: "Código de religión CAMEO"
        tests:
          - unique
          - not_null
      - name: religion_name
        description: "Nombre de la religión"
        tests:
          - not_null
      - name: parent_id
        description: "Código de la religión padre — NULL si es religión raíz"

  - name: __stg_gdelt_export
    description: "Staging principal de GDELT export. Castea tipos, genera hashes MD5 para actores y geo, y normaliza códigos de país a ISO3."
    columns:
      - name: event_id
        description: "ID único del evento GDELT"
        tests:
          - not_null
      - name: event_date
        description: "Fecha del evento en formato DATE"
        tests:
          - not_null
      - name: date_added
        description: "Timestamp exacto en que GDELT procesó el evento"
      - name: source_url
        description: "URL del artículo fuente"
      - name: actor1_code
        description: "Código completo del actor 1 en GDELT"
      - name: actor1_name
        description: "Nombre del actor 1"
      - name: actor1_id
        description: "Hash MD5 de actor1_code + actor1_name — identificador único del actor 1"
        tests:
          - not_null
      - name: actor1_country_code
        description: "Código de país del actor 1 — puede ser FIPS o ISO3"
      - name: actor1_known_group_code
        description: "Código de grupo conocido del actor 1"
      - name: actor1_ethnic_code
        description: "Código étnico del actor 1"
      - name: actor1_religion1_code
        description: "Religión principal del actor 1"
      - name: actor1_religion2_code
        description: "Religión secundaria del actor 1"
      - name: actor1_type1_code
        description: "Tipo principal del actor 1"
      - name: actor1_type2_code
        description: "Tipo secundario del actor 1"
      - name: actor1_type3_code
        description: "Tipo terciario del actor 1"
      - name: actor2_code
        description: "Código completo del actor 2 en GDELT"
      - name: actor2_name
        description: "Nombre del actor 2"
      - name: actor2_id
        description: "Hash MD5 de actor2_code + actor2_name — identificador único del actor 2"
        tests:
          - not_null
      - name: actor2_country_code
        description: "Código de país del actor 2 — puede ser FIPS o ISO3"
      - name: actor2_known_group_code
        description: "Código de grupo conocido del actor 2"
      - name: actor2_ethnic_code
        description: "Código étnico del actor 2"
      - name: actor2_religion1_code
        description: "Religión principal del actor 2"
      - name: actor2_religion2_code
        description: "Religión secundaria del actor 2"
      - name: actor2_type1_code
        description: "Tipo principal del actor 2"
      - name: actor2_type2_code
        description: "Tipo secundario del actor 2"
      - name: actor2_type3_code
        description: "Tipo terciario del actor 2"
      - name: is_root_event
        description: "TRUE si es el evento principal del artículo"
        tests:
          - not_null
      - name: cameo_code_id
        description: "Código CAMEO completo del evento"
        tests:
          - not_null
      - name: event_subcode
        description: "Subcódigo del evento — últimos 2 dígitos del cameo_code_id"
      - name: event_base_code
        description: "Código CAMEO de 3 dígitos — nivel intermedio"
      - name: event_root_code
        description: "Código CAMEO de 2 dígitos — nivel raíz"
        tests:
          - not_null
      - name: quad_class_id
        description: "Clasificación del evento en 4 categorías (1-4)"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4]
      - name: goldstein_scale
        description: "Puntuación de impacto geopolítico (-10 a +10)"
      - name: num_mentions
        description: "Número de menciones del evento"
      - name: num_sources
        description: "Número de fuentes que cubren el evento"
      - name: num_articles
        description: "Número de artículos que cubren el evento"
      - name: avg_tone
        description: "Tono promedio de la cobertura mediática (-100 a +100)"
      - name: geo_locations_id
        description: "Hash MD5 de fullname + iso3_code + geo_type — identificador único de la ubicación"
      - name: action_geo_type
        description: "Tipo de ubicación geográfica (0-5)"
      - name: action_geo_fullname
        description: "Nombre completo de la ubicación"
      - name: action_geo_country_code
        description: "Código de país de la ubicación"
      - name: action_geo_adm1_code
        description: "Región administrativa nivel 1"
      - name: action_geo_adm2_code
        description: "Región administrativa nivel 2"
      - name: action_geo_lat
        description: "Latitud de la ubicación"
      - name: action_geo_long
        description: "Longitud de la ubicación"
      - name: loaded_at
        description: "Timestamp de carga en bronze"
        tests:
          - not_null
      - name: source_file
        description: "Nombre del fichero fuente en S3"