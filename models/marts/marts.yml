version: 2

models:

  - name: fact_bilateral_relations
    description: "Relaciones bilaterales entre países basada en eventos GDELT. Usa la versión más reciente de cada evento. Agrega métricas de cooperación y conflicto entre cada par de países."
    columns:
      - name: country_from
        description: "País que inicia la acción (actor1)"
        tests:
          - not_null

      - name: country_to
        description: "País que recibe la acción (actor2)"
        tests:
          - not_null

      - name: total_events
        description: "Número total de eventos entre los dos países"
        tests:
          - not_null

      - name: avg_goldstein
        description: "Promedio de GoldsteinScale — impacto teórico de los eventos (-10 a +10)"
        tests:
          - not_null

      - name: avg_tone
        description: "Promedio del tono mediático de los artículos que cubren los eventos"
        tests:
          - not_null

      - name: dominant_cameo_root
        description: "Descripción del tipo de evento CAMEO más frecuente entre los dos países"

      - name: narrative_vs_reality
        description: "Detecta divergencias entre el tipo de acción real y la narrativa mediática"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Clear cooperation', 'Clear conflict', 'Cooperation under tension', 'Conflict with positive narrative']

      - name: total_articles
        description: "Suma total de artículos que cubren los eventos entre los dos países"
        tests:
          - not_null

      - name: total_mentions
        description: "Suma total de menciones de los eventos entre los dos países"
        tests:
          - not_null

      - name: avg_articles_per_event
        description: "Promedio de artículos por evento — indica la relevancia mediática media"
        tests:
          - not_null

      - name: cooperation_events
        description: "Número de eventos de cooperación (QuadClass 1 o 2)"
        tests:
          - not_null

      - name: conflict_events
        description: "Número de eventos de conflicto (QuadClass 3 o 4)"
        tests:
          - not_null

      - name: cooperation_rate
        description: "Porcentaje de eventos de cooperación sobre el total (0-100)"
        tests:
          - not_null

  - name: fact_media_noise
    description: "Índice de ruido mediático por país, fecha y tipo de evento CAMEO. Detecta qué eventos reciben cobertura desproporcionada respecto a su impacto geopolítico real. Usa la versión más reciente de cada evento."
    columns:
      - name: full_date
        description: "Fecha completa del evento"
        tests:
          - not_null

      - name: year
        description: "Año del evento"
        tests:
          - not_null

      - name: month
        description: "Mes numérico del evento"
        tests:
          - not_null

      - name: month_name
        description: "Nombre del mes del evento"
        tests:
          - not_null

      - name: country_name
        description: "Nombre completo del país donde ocurre el evento"
        tests:
          - not_null

      - name: cameo_root_name
        description: "Descripción del código CAMEO completo"
        tests:
          - not_null

      - name: cameo_full_code_desc
        description: "Descripción de la categoría raíz CAMEO"

      - name: total_events
        description: "Número total de eventos para esa combinación de país, fecha y tipo CAMEO"
        tests:
          - not_null

      - name: avg_goldstein
        description: "Promedio de GoldsteinScale — impacto geopolítico real (-10 a +10)"
        tests:
          - not_null

      - name: avg_articles
        description: "Promedio de artículos por evento — cobertura mediática"
        tests:
          - not_null

      - name: avg_mentions
        description: "Promedio de menciones por evento"
        tests:
          - not_null

      - name: noise_index
        description: "Índice de ruido — ratio entre cobertura mediática e impacto real. Valores altos indican sobrerepresentación mediática"

      - name: noise_category
        description: "Clasificación del nivel de distorsión mediática"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Overrepresented', 'Underrepresented', 'Noise', 'Ignored']