version: 2

models:

  - name: fact_bilateral_relations
    config:
      contract:
        enforced: true
    description: "Relaciones bilaterales entre países basada en eventos GDELT. Usa la versión más reciente de cada evento. Agrega métricas de cooperación y conflicto entre cada par de países. PK: country_from + country_to."
    columns:
      - name: country_from
        description: "País que inicia la acción — parte de la PK compuesta"
        data_type: varchar
        constraints:
          - type: not_null
        tests:
          - not_null

      - name: country_to
        description: "País que recibe la acción — parte de la PK compuesta"
        data_type: varchar
        constraints:
          - type: not_null
        tests:
          - not_null

      - name: total_events
        description: "Número total de eventos entre los dos países"
        data_type: number(38,0)
        constraints:
          - type: not_null
        tests:
          - not_null

      - name: avg_goldstein
        description: "Promedio de GoldsteinScale — impacto teórico de los eventos (-10 a +10)"
        data_type: float
        constraints:
          - type: not_null
        tests:
          - not_null

      - name: avg_tone
        description: "Promedio del tono mediático de los artículos que cubren los eventos"
        data_type: float
        constraints:
          - type: not_null
        tests:
          - not_null

      - name: narrative_vs_reality_value
        description: "Valor numérico combinado de avg_goldstein + avg_tone"
        data_type: float
        constraints:
          - type: not_null
        tests:
          - not_null

      - name: cameo_full_id
        description: "Código CAMEO más frecuente entre los dos países (MODE)"
        data_type: varchar

      - name: narrative_vs_reality
        description: "Detecta divergencias entre el tipo de acción real y la narrativa mediática"
        data_type: varchar
        constraints:
          - type: not_null
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Clear cooperation', 'Clear conflict', 'Cooperation under tension', 'Conflict with positive narrative']

      - name: total_articles
        description: "Suma total de artículos que cubren los eventos entre los dos países"
        data_type: number(38,0)
        constraints:
          - type: not_null
        tests:
          - not_null

      - name: total_mentions
        description: "Suma total de menciones de los eventos entre los dos países"
        data_type: number(38,0)
        constraints:
          - type: not_null
        tests:
          - not_null

      - name: avg_articles_per_event
        description: "Promedio de artículos por evento — indica la relevancia mediática media"
        data_type: number(38,6)
        constraints:
          - type: not_null
        tests:
          - not_null

  - name: fact_media_noise
    config:
      contract:
        enforced: true
    description: "Índice de ruido mediático por actor, fecha y código CAMEO. Detecta qué eventos reciben cobertura desproporcionada respecto a su impacto geopolítico real."
    columns:
      - name: date_id
        description: "FK hacia dim_date"
        data_type: number(38,0)
        constraints:
          - type: not_null
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_id

      - name: actor_id
        description: "FK hacia dim_actor"
        data_type: varchar
        constraints:
          - type: not_null
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_actor')
                field: actor_id

      - name: cameo_full_id
        description: "FK hacia dim_cameo"
        data_type: varchar
        constraints:
          - type: not_null
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_cameo')
                field: cameo_full_id

      - name: total_events
        description: "Número total de eventos para esa combinación de actor, fecha y tipo CAMEO"
        data_type: number(38,0)
        constraints:
          - type: not_null
        tests:
          - not_null

      - name: avg_goldstein
        description: "Promedio de GoldsteinScale — impacto geopolítico real (-10 a +10)"
        data_type: float
        constraints:
          - type: not_null
        tests:
          - not_null

      - name: avg_articles
        description: "Promedio de artículos por evento — cobertura mediática"
        data_type: number(38,6)
        constraints:
          - type: not_null
        tests:
          - not_null

      - name: avg_mentions
        description: "Promedio de menciones por evento"
        data_type: number(38,6)
        constraints:
          - type: not_null
        tests:
          - not_null

      - name: noise_index
        description: "Índice de ruido — ratio entre cobertura mediática e impacto real"
        data_type: float

      - name: noise_category
        description: "Clasificación del nivel de distorsión mediática"
        data_type: varchar
        constraints:
          - type: not_null
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Overrepresented', 'Underrepresented', 'Noise', 'Ignored']