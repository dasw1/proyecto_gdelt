version: 2

models:

  - name: fact_bilateral_relations
    config:
      contract:
        enforced: true
    description: "Relaciones bilaterales entre países basada en eventos GDELT. Usa la versión más reciente de cada evento. Agrega métricas de cooperación y conflicto entre cada par de países. Normalizado — usa country_id como FK hacia dim_actor."
    columns:
      - name: country_from
        description: "FK hacia dim_actor — país que inicia la acción (actor1)"
        tests:
          - not_null

      - name: country_to
        description: "FK hacia dim_actor — país que recibe la acción (actor2)"
        tests:
          - not_null

      - name: total_events
        description: "Número total de eventos entre los dos países"
        tests:
          - not_null

      - name: avg_goldstein
        description: "Promedio de GoldsteinScale — impacto teórico de los eventos (-10 a +10)"
        tests:
          - not_null

      - name: avg_tone
        description: "Promedio del tono mediático de los artículos que cubren los eventos"
        tests:
          - not_null

      - name: narrative_vs_reality_value
        description: "Valor numérico combinado de avg_goldstein + avg_tone — útil para ordenar relaciones"
        tests:
          - not_null

      - name: dominant_cameo_root
        description: "Descripción del tipo de evento CAMEO más frecuente entre los dos países"

      - name: narrative_vs_reality
        description: "Detecta divergencias entre el tipo de acción real y la narrativa mediática"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Clear cooperation', 'Clear conflict', 'Cooperation under tension', 'Conflict with positive narrative']

      - name: total_articles
        description: "Suma total de artículos que cubren los eventos entre los dos países"
        tests:
          - not_null

      - name: total_mentions
        description: "Suma total de menciones de los eventos entre los dos países"
        tests:
          - not_null

      - name: avg_articles_per_event
        description: "Promedio de artículos por evento — indica la relevancia mediática media"
        tests:
          - not_null

  - name: fact_media_noise
    config:
      contract:
        enforced: true
    description: "Índice de ruido mediático por actor, fecha y código CAMEO. Normalizado — usa actor_id y cameo_full_id como FKs. Detecta qué eventos reciben cobertura desproporcionada respecto a su impacto geopolítico real."
    columns:
      - name: date_id
        description: "FK hacia dim_date"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_id

      - name: actor_id
        description: "FK hacia dim_actor"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_actor')
                field: actor_id

      - name: cameo_full_id
        description: "FK hacia dim_cameo"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_cameo')
                field: cameo_full_id

      - name: total_events
        description: "Número total de eventos para esa combinación de actor, fecha y tipo CAMEO"
        tests:
          - not_null

      - name: avg_goldstein
        description: "Promedio de GoldsteinScale — impacto geopolítico real (-10 a +10)"
        tests:
          - not_null

      - name: avg_articles
        description: "Promedio de artículos por evento — cobertura mediática"
        tests:
          - not_null

      - name: avg_mentions
        description: "Promedio de menciones por evento"
        tests:
          - not_null

      - name: noise_index
        description: "Índice de ruido — ratio entre cobertura mediática e impacto real"

      - name: noise_category
        description: "Clasificación del nivel de distorsión mediática"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Overrepresented', 'Underrepresented', 'Noise', 'Ignored']